<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bgEng)"/>
  <rect width="1196" height="676" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Blueprint Engineering Grid -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="40"/>
    </pattern>
    <rect width="1200" height="680" fill="url(#grid)"/>
  </g>

  <!-- Header Section -->
  <text x="40" y="46" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
    SYSTEM SPECIFICATION // ARCHITECTURE BLUEPRINT
  </text>
  <text x="40" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    EraLang End-to-End Compilation &amp; Execution Pipeline
  </text>
  <line x1="40" y1="94" x2="1160" y2="94" stroke="#334155" stroke-width="1"/>

  <!-- ================= PHASE 1: FRONTEND ================= -->
  <g transform="translate(40, 120)">
    <!-- Phase Label -->
    <rect width="240" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#38bdf8">
      PHASE 01: LEXICAL SCANNER
    </text>

    <!-- Component Box -->
    <rect y="36" width="240" height="180" rx="8" fill="url(#boxGrad1)" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Source (.era) ➔ Tokens</text>
    <text x="16" y="92" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• SourceLocation tracking</text>
    <text x="16" y="112" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• UTF-8 BOM tolerance</text>
    <text x="16" y="132" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• String escape decoding</text>
    <text x="16" y="152" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Operator (@, .., =&gt;)</text>
    <text x="16" y="172" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Zero-copy string slices</text>
    <text x="16" y="196" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#38bdf8">Output: List[Token] (Spans)</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 280 240 L 330 240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= PHASE 2: PRATT PARSER ================= -->
  <g transform="translate(340, 120)">
    <rect width="250" height="24" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="12" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#818cf8">
      PHASE 02: PRATT PARSER
    </text>

    <rect y="36" width="250" height="180" rx="8" fill="url(#boxGrad2)" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Recursive Descent AST</text>
    <text x="16" y="92" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Pratt precedence table</text>
    <text x="16" y="112" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Tensor '@' matmul grammar</text>
    <text x="16" y="132" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Struct / Enum declarations</text>
    <text x="16" y="152" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• MatchExpr pattern trees</text>
    <text x="16" y="172" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Method-chain pipelines</text>
    <text x="16" y="196" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#818cf8">Output: Program (AST Root)</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 590 240 L 640 240" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= PHASE 3: TYPECHECKER & VERIFIER ================= -->
  <g transform="translate(650, 120)">
    <rect width="250" height="24" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="12" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#34d399">
      PHASE 03: STATIC TYPECHECKER
    </text>

    <rect y="36" width="250" height="180" rx="8" fill="url(#boxGrad3)" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Design-Time Safety Core</text>
    <text x="16" y="92" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Lexical Scope SymbolTable</text>
    <text x="16" y="112" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Option&lt;T&gt; exhaustiveness</text>
    <text x="16" y="132" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Result&lt;T,E&gt; branch matrix</text>
    <text x="16" y="152" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• let vs var immutability</text>
    <text x="16" y="172" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Mentor auto-fix engine</text>
    <text x="16" y="196" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#34d399">Output: Verified Type-Safe AST</text>
  </g>

  <!-- Flow Connector 3 -> 4 / Backends -->
  <path d="M 900 240 L 960 240" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ================= PHASE 4: CODEGEN / COMPILER ================= -->
  <g transform="translate(970, 120)">
    <rect width="190" height="24" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
    <text x="12" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#c084fc">
      PHASE 04: COMPILER
    </text>

    <rect y="36" width="190" height="180" rx="8" fill="url(#boxGrad4)" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Bytecode Emitter</text>
    <text x="16" y="92" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• OpCode serialization</text>
    <text x="16" y="112" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Constant pool indexing</text>
    <text x="16" y="132" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Jump patch resolution</text>
    <text x="16" y="152" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Stack slot assignment</text>
    <text x="16" y="196" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#c084fc">Output: Chunk (.erac)</text>
  </g>

  <!-- ================= LOWER SECTION: THREE EXECUTION BACKENDS ================= -->
  <g transform="translate(40, 370)">
    <rect width="1120" height="270" rx="10" fill="#0d1424" stroke="#334155" stroke-width="1.5"/>
    
    <text x="24" y="32" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1.2">
      PHASE 05: TRI-ENGINE EXECUTION ARCHITECTURE (TARGET RUNTIMES)
    </text>

    <!-- Backend 1: Tree-Walk Evaluator -->
    <g transform="translate(24, 52)">
      <rect width="340" height="190" rx="8" fill="#111c30" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="16" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">
        1. Tree-Walk Evaluator
      </text>
      <text x="16" y="56" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Direct AST interpretation</text>
      <text x="16" y="76" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Scoped Environment chains</text>
      <text x="16" y="96" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Capability-based SecurityPolicy</text>
      <text x="16" y="116" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Native REPL &amp; Web Playground</text>
      <text x="16" y="146" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#34d399">
        Target: Interactive Scripting &amp; REPL
      </text>
      <text x="16" y="168" font-family="'Fira Code', monospace" font-size="10.5" fill="#64748b">Command: era run &lt;file&gt;</text>
    </g>

    <!-- Backend 2: Stack-Based Bytecode VM -->
    <g transform="translate(390, 52)">
      <rect width="340" height="190" rx="8" fill="#111c30" stroke="#a855f7" stroke-width="1.2"/>
      <text x="16" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#a855f7">
        2. Stack-Based Bytecode VM
      </text>
      <text x="16" y="56" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• LIFO evaluation operand stack</text>
      <text x="16" y="76" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• CallFrame stack with local base-ptrs</text>
      <text x="16" y="96" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• 40+ optimized virtual opcodes</text>
      <text x="16" y="116" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• 5-8x faster than tree evaluation</text>
      <text x="16" y="146" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#34d399">
        Target: Production Server &amp; Edge VM
      </text>
      <text x="16" y="168" font-family="'Fira Code', monospace" font-size="10.5" fill="#64748b">Command: era run --vm &lt;file&gt;</text>
    </g>

    <!-- Backend 3: Native C Transpiler -->
    <g transform="translate(756, 52)">
      <rect width="340" height="190" rx="8" fill="#111c30" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="16" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f59e0b">
        3. Ahead-Of-Time C Transpiler
      </text>
      <text x="16" y="56" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• AST ➔ ANSI C code generation</text>
      <text x="16" y="76" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Embedded runtime stdlib header</text>
      <text x="16" y="96" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Automatic gcc/clang compilation</text>
      <text x="16" y="116" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">• Zero Python runtime dependency</text>
      <text x="16" y="146" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#34d399">
        Target: Standalone Machine Executable
      </text>
      <text x="16" y="168" font-family="'Fira Code', monospace" font-size="10.5" fill="#64748b">Command: era build --native &lt;file&gt;</text>
    </g>
  </g>
</svg>
