<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1196" height="416" x="2" y="2" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Decorative Tech Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="160" fill="#818cf8" opacity="0.09" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="120" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>

  <!-- Top Release Pill -->
  <g transform="translate(480, 48)">
    <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
      VERSION 2.1.0 • PRODUCTION READY
    </text>
  </g>

  <!-- Hero Logo & Title -->
  <g transform="translate(600, 165)">
    <!-- Star Icon Graphic -->
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      🌟 EraLang
    </text>
  </g>

  <!-- Hero Subtitle -->
  <text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#e2e8f0" letter-spacing="-0.2">
    The AI-Native, Pitfall-Proof Programming Language
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Eliminating 80%+ of silent production bugs with Rust-grade safety, Python agility, and native AI tensors.
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(130, 305)">
    <!-- Badge 1: Zero Nulls -->
    <g transform="translate(0, 0)">
      <rect width="170" height="42" rx="8" fill="#111827" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#38bdf8">
        🛡️ Zero Nulls (Option)
      </text>
    </g>

    <!-- Badge 2: Zero Coercion -->
    <g transform="translate(190, 0)">
      <rect width="175" height="42" rx="8" fill="#111827" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="87" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#10b981">
        🔒 Strict Type Safety
      </text>
    </g>

    <!-- Badge 3: Native Tensors -->
    <g transform="translate(385, 0)">
      <rect width="175" height="42" rx="8" fill="#111827" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="87" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#818cf8">
        🧠 Native Tensors (@)
      </text>
    </g>

    <!-- Badge 4: Polyglot Bridge -->
    <g transform="translate(580, 0)">
      <rect width="175" height="42" rx="8" fill="#111827" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
      <text x="87" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#fbbf24">
        🐍 500k+ PyPI Bridge
      </text>
    </g>

    <!-- Badge 5: Bytecode VM -->
    <g transform="translate(775, 0)">
      <rect width="165" height="42" rx="8" fill="#111827" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#ec4899">
        ⚡ Bytecode VM + C
      </text>
    </g>
  </g>

  <!-- Bottom Interactive CTA -->
  <g transform="translate(500, 375)">
    <text x="100" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
      TRY LIVE IN BROWSER • RAHULVPD.GITHUB.IO/ERALANG
    </text>
  </g>
</svg>
