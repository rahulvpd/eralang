[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eralang"
version = "2.1.0"
authors = [
  { name="EraLang Core Team", email="maintainers@eralang.org" },
]
description = "The AI-Native, Pitfall-Proof Programming Language - 9.0+ Production Ready"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
[project.optional-dependencies]
numpy = ["numpy>=1.20"]
ai = ["openai>=1.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
era = "eralang.cli:main"
