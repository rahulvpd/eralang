name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in EraLang
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in EraLang!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducible Example (.era code)
      description: Please paste the minimal EraLang code that triggers the issue.
      render: rust
      value: |
        // Minimal code reproducing the bug
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EraLang Version
      description: Output of `era --version` or `python era.py info`
      placeholder: e.g. 2.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Execution Mode
      description: Which engine did you run this on?
      options:
        - Tree-walk Evaluator (`era run`)
        - Bytecode VM (`era run --vm`)
        - Native C Transpiler (`era build --native`)
        - Interactive REPL (`era repl`)
        - Web Playground
    validations:
      required: true
